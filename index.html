<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>THRYLOS INDIA — Web, Mobile & Digital Solutions</title>
    <meta name="description" content="THRYLOS INDIA builds web, mobile, cloud, AI and cybersecurity solutions for modern businesses. Plan, design, ship and scale with our team." />
    <meta name="author" content="THRYLOS INDIA" />
    <meta name="robots" content="index, follow" />
    <!-- Per-route canonical is set via react-helmet-async (SEO component) -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THRYLOS INDIA" />
    <meta property="og:url" content="https://thrylosindia.in/" />
    <meta property="og:image" content="https://thrylosindia.in/thrylosindia.png" />
    <meta property="og:title" content="THRYLOS INDIA — Web, Mobile & Digital Solutions" />
    <meta property="og:description" content="Web, mobile, cloud, AI and cybersecurity solutions for modern businesses." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://thrylosindia.in/thrylosindia.png" />
    <meta name="twitter:title" content="THRYLOS INDIA — Web, Mobile & Digital Solutions" />
    <meta name="twitter:description" content="Web, mobile, cloud, AI and cybersecurity solutions for modern businesses." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/thrylosindia.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="THRYLOS" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://thrylosindia.in/#org",
        "name": "THRYLOS INDIA",
        "legalName": "THRYLOS INDIA",
        "url": "https://thrylosindia.in/",
        "logo": "https://thrylosindia.in/thrylosindia.png",
        "image": "https://thrylosindia.in/thrylosindia.png",
        "description": "Technology studio in New Delhi building websites, web apps, mobile apps, cloud, AI and cybersecurity solutions.",
        "email": "support@thrylosindia.in",
        "founder": { "@type": "Person", "name": "Utsav Ratan" },
        "address": { "@type": "PostalAddress", "addressLocality": "New Delhi", "addressRegion": "Delhi", "addressCountry": "IN" },
        "areaServed": ["IN", "Worldwide"],
        "knowsAbout": ["Web development", "Mobile app development", "Cloud computing", "AI integration", "Cybersecurity", "SEO", "UI/UX design"],
        "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "email": "support@thrylosindia.in", "areaServed": "IN", "availableLanguage": ["English", "Hindi"] },
        "sameAs": []
      }
    </script>

    <!-- WebSite JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "THRYLOS INDIA",
        "url": "https://thrylosindia.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://thrylosindia.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
